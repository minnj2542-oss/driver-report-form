<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>동탄CPG물품신고</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b5bdb">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="동탄CPG물품신고">
<style>
  :root {
    --primary: #3b5bdb;
    --primary-dark: #2f4bc7;
    --danger: #e03131;
    --success: #2f9e44;
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #dcdfe4;
    --text: #1b1f27;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
    line-height: 1.45;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 68px 14px 88px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  label {
    display: block;
    font-weight: 700;
    margin-bottom: 6px;
    font-size: 15px;
  }
  input[type="text"], input[type="tel"] {
    width: 100%;
    font-size: 18px;
    padding: 11px 10px;
    border: 2px solid var(--border);
    border-radius: 10px;
    margin-bottom: 4px;
    -webkit-appearance: none;
  }
  input:focus { outline: none; border-color: var(--primary); }
  .item-block {
    background: var(--bg);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    position: relative;
  }
  .item-block .item-title {
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 8px;
    font-size: 15px;
  }
  .item-remove {
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: none;
    color: var(--danger);
    font-size: 14px;
    font-weight: 700;
    padding: 6px 8px;
  }
  .match-result {
    font-size: 14px;
    font-weight: 600;
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 8px;
    display: none;
  }
  .match-result.found {
    display: block;
    background: #ebfbee;
    color: var(--success);
  }
  .match-result.not-found {
    display: block;
    background: #fff4e6;
    color: #e8590c;
  }
  .add-item-btn {
    width: 100%;
    padding: 13px;
    font-size: 16px;
    font-weight: 700;
    background: #eef1ff;
    color: var(--primary);
    border: 2px dashed var(--primary);
    border-radius: 12px;
  }
  .reason-btn {
    width: 100%;
    display: block;
    text-align: left;
    padding: 12px 12px;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: -0.3px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: #fff;
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .reason-btn.selected {
    border-color: var(--primary);
    background: #eef1ff;
    color: var(--primary-dark);
  }
  textarea {
    width: 100%;
    font-size: 16px;
    padding: 10px;
    border: 2px solid var(--border);
    border-radius: 10px;
    min-height: 80px;
    font-family: inherit;
    resize: vertical;
  }
  .submit-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  }
  .submit-bar-inner { max-width: 480px; margin: 0 auto; }
  #submitBtn {
    width: 100%;
    padding: 15px;
    font-size: 19px;
    font-weight: 800;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
  }
  #submitBtn:disabled { background: #a9b3d6; }
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    margin: 2px 0 8px;
  }
  #resultScreen {
    display: none;
    text-align: center;
    padding: 60px 20px;
  }
  #resultScreen .icon { font-size: 64px; margin-bottom: 16px; }
  #resultScreen h2 { font-size: 24px; margin-bottom: 10px; }
  #resultScreen p { color: var(--muted); font-size: 16px; margin-bottom: 26px; }
  #resultScreen.error h2 { color: var(--danger); }
  #resultSummary { margin: 0 0 18px; }
  #resultSummary:empty { display: none; }
  #resultSummary .summary-line {
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 8px;
    text-align: center;
    font-size: 15px;
    color: var(--text);
  }
  #resultSummary .summary-line:last-child { margin-bottom: 0; }
  #resetBtn, #retryBtn {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    font-weight: 700;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
  }
  #formScreen.hidden { display: none; }
  .fab {
    position: fixed;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(30, 40, 90, 0.16), 0 2px 6px rgba(30, 40, 90, 0.08);
    cursor: pointer;
    z-index: 50;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .fab:active { transform: scale(0.92); }
  #myStatusFab {
    top: 16px;
    right: 16px;
    background: #fff;
    color: var(--primary);
  }
  #refreshFab {
    bottom: calc(20px + env(safe-area-inset-bottom));
    right: 20px;
    background: var(--primary);
    color: #fff;
  }
  #refreshFab.hidden { display: none; }
  #myStatusScreen.hidden { display: none; }
  .my-status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
  }
  .my-status-row.not-today { opacity: 0.5; }
  .my-status-icon { font-size: 20px; flex-shrink: 0; }
  .my-status-info { flex: 1; font-size: 15px; }
  .my-status-info .dispatch { font-weight: 700; }
  .my-status-info .time { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .my-status-label {
    font-size: 12.5px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .my-status-label.done { background: #ebfbee; color: var(--success); }
  .my-status-label.pending { background: #fff4e6; color: #e8590c; }
  .my-status-empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 15px;
  }
</style>
</head>
<body>
<button type="button" class="fab" id="myStatusFab" title="내 신고 현황">📋</button>
<button type="button" class="fab hidden" id="refreshFab" title="새로고침">🔄</button>

<div class="wrap">

  <div id="myStatusScreen" class="hidden">
    <div id="myStatusList"></div>
  </div>

  <div id="formScreen">
    <div class="card">
      <div class="section-title">배차 정보</div>
      <label for="dispatchNo">배차번호</label>
      <input type="tel" id="dispatchNo" placeholder="EX) 12" inputmode="numeric">
      <label for="location" style="margin-top:10px;">위치</label>
      <input type="text" id="location" placeholder="EX) B방">
    </div>

    <div class="card">
      <div class="section-title">상품 정보</div>
      <div id="itemList"></div>
      <button type="button" class="add-item-btn" id="addItemBtn">+ 항목 추가</button>
    </div>

    <div class="card">
      <div class="section-title">요청사항</div>
      <button type="button" class="reason-btn" data-reason="물건 나오지 않아 이동 부탁드립니다.">물건 나오지 않아 이동 부탁드립니다.</button>
      <button type="button" class="reason-btn" data-reason="파손으로 인해 교환 부탁드립니다.">파손으로 인해 교환 부탁드립니다.</button>
      <button type="button" class="reason-btn" data-reason="확인부탁드립니다.">확인부탁드립니다.</button>
      <button type="button" class="reason-btn" id="customReasonBtn" data-reason="">기타</button>
      <textarea id="customReasonText" placeholder="요청사항을 입력하세요" style="display:none; margin-top:8px;"></textarea>
    </div>
  </div>

  <div id="resultScreen">
    <div class="icon" id="resultIcon">✅</div>
    <h2 id="resultTitle">전송 완료</h2>
    <div id="resultSummary"></div>
    <p id="resultMsg">담당자에게 전달되었습니다.</p>
    <button id="resetBtn" type="button">새로 작성</button>
  </div>
</div>

<div class="submit-bar" id="submitBar">
  <div class="submit-bar-inner">
    <button id="submitBtn" type="button">전송하기</button>
  </div>
</div>

<script>
// Apps Script 웹앱 배포 후 이 URL을 실제 /exec 주소로 교체하세요.
const APPS_SCRIPT_URL = "https://blue-snowflake-09f5.6611cc.workers.dev";

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// 상품코드 -> {name, zone} 매핑. 페이지 로드 시 한 번 불러와서 캐시.
let productMap = {};

async function loadProducts() {
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=products');
    const data = await res.json();
    if (data.ok) {
      data.products.forEach(p => { productMap[p.code] = { name: p.name, zone: p.zone }; });
    }
  } catch (err) {
    console.error('상품 목록 불러오기 실패', err);
  }
}
loadProducts();

let itemCount = 0;
const itemList = document.getElementById('itemList');

function addItem() {
  itemCount++;
  const idx = itemCount;
  const block = document.createElement('div');
  block.className = 'item-block';
  block.dataset.idx = idx;
  block.innerHTML = `
    ${idx > 1 ? `<button type="button" class="item-remove" data-remove="${idx}">삭제</button>` : ''}
    <div class="item-title">상품 ${idx}</div>
    <label>상품코드</label>
    <input type="tel" inputmode="numeric" class="item-code" placeholder="EX) 220458">
    <div class="match-result"></div>
    <label style="margin-top:8px;">수량(박스)</label>
    <input type="tel" inputmode="numeric" class="item-qty" placeholder="EX) 2">
  `;
  itemList.appendChild(block);

  const codeInput = block.querySelector('.item-code');
  codeInput.addEventListener('input', () => matchProduct(block));

  const removeBtn = block.querySelector('[data-remove]');
  if (removeBtn) {
    removeBtn.addEventListener('click', () => block.remove());
  }
}

function matchProduct(block) {
  const code = block.querySelector('.item-code').value.trim();
  const resultEl = block.querySelector('.match-result');

  if (!code) {
    resultEl.className = 'match-result';
    resultEl.textContent = '';
    return;
  }

  const match = productMap[code];
  if (match) {
    resultEl.className = 'match-result found';
    resultEl.textContent = '✓ ' + match.name + (match.zone ? ' · ' + match.zone + '존' : '');
  } else {
    resultEl.className = 'match-result not-found';
    resultEl.textContent = '등록된 상품코드가 아니에요. 코드를 다시 확인해주세요.';
  }
}

document.getElementById('addItemBtn').addEventListener('click', addItem);

// 요청사항 버튼 처리
let selectedReason = '';
const reasonBtns = document.querySelectorAll('.reason-btn');
const customReasonText = document.getElementById('customReasonText');

reasonBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    reasonBtns.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    if (btn.id === 'customReasonBtn') {
      customReasonText.style.display = 'block';
      customReasonText.focus();
      selectedReason = customReasonText.value;
    } else {
      customReasonText.style.display = 'none';
      selectedReason = btn.dataset.reason;
    }
  });
});
customReasonText.addEventListener('input', () => {
  selectedReason = customReasonText.value;
});

function buildPayload() {
  const dispatchNo = document.getElementById('dispatchNo').value.trim();
  const location = document.getElementById('location').value.trim();
  const items = [];
  itemList.querySelectorAll('.item-block').forEach(block => {
    const code = block.querySelector('.item-code').value.trim();
    const qty = block.querySelector('.item-qty').value.trim();
    const match = productMap[code];
    const name = match ? match.name : '';
    const zone = match ? match.zone : '';
    if (code) items.push({ code, name, zone, qty });
  });
  const reason = selectedReason.trim();
  return { dispatchNo, location, items, reason };
}

function isValid() {
  const { dispatchNo, location, items, reason } = buildPayload();
  if (!dispatchNo || !location) return false;
  if (items.length === 0) return false;
  for (const it of items) {
    if (!it.code || !it.name || !it.qty) return false;
  }
  if (!reason) return false;
  return true;
}

document.getElementById('submitBtn').addEventListener('click', async () => {
  if (!isValid()) {
    alert('배차번호, 위치, 상품정보(코드/수량), 요청사항을 모두 입력해주세요.');
    return;
  }
  const payload = buildPayload();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '전송 중...';

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.ok) {
      saveMyReport({
        id: data.id,
        dispatchNo: payload.dispatchNo,
        location: payload.location,
        timestamp: new Date().toISOString()
      });
      showResult(true, null, payload.items);
    } else {
      showResult(false, data.error);
    }
  } catch (err) {
    showResult(false, String(err));
  } finally {
    btn.disabled = false;
    btn.textContent = '전송하기';
  }
});

function showResult(success, errMsg, items) {
  document.getElementById('formScreen').classList.add('hidden');
  document.getElementById('submitBar').style.display = 'none';
  const screen = document.getElementById('resultScreen');
  screen.style.display = 'block';
  const summaryEl = document.getElementById('resultSummary');
  if (success) {
    screen.classList.remove('error');
    document.getElementById('resultIcon').textContent = '✅';
    document.getElementById('resultTitle').textContent = '전송 완료';
    document.getElementById('resultMsg').textContent = '담당자에게 전달되었습니다.';
    summaryEl.innerHTML = (items || [])
      .map(it => `<div class="summary-line">${it.code}) ${it.name} - ${it.qty}박스</div>`)
      .join('');
  } else {
    summaryEl.innerHTML = '';
    screen.classList.add('error');
    document.getElementById('resultIcon').textContent = '⚠️';
    document.getElementById('resultTitle').textContent = '전송 실패';
    document.getElementById('resultMsg').textContent = '잠시 후 다시 시도해주세요. (' + (errMsg || '오류') + ')';
  }
}

// ── 내 신고 현황 (이 폰에서 보낸 기록만, localStorage 기반) ──
const MY_REPORTS_KEY = 'myReports';

function getMyReports() {
  try {
    return JSON.parse(localStorage.getItem(MY_REPORTS_KEY) || '[]');
  } catch (err) {
    return [];
  }
}

function saveMyReport(entry) {
  const list = getMyReports();
  list.unshift(entry);
  localStorage.setItem(MY_REPORTS_KEY, JSON.stringify(list.slice(0, 20))); // 최근 20건까지만 보관, 이후는 자동 삭제
}

function formatMyTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function isToday(iso) {
  const d = new Date(iso);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() &&
    d.getMonth() === now.getMonth() &&
    d.getDate() === now.getDate();
}

async function loadMyStatus() {
  const myReports = getMyReports();
  const listEl = document.getElementById('myStatusList');

  if (myReports.length === 0) {
    listEl.innerHTML = '<div class="my-status-empty">아직 제출한 신고가 없습니다.</div>';
    return;
  }

  listEl.innerHTML = '<div class="my-status-empty">불러오는 중...</div>';

  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '불러오기 실패');

    const statusMap = {};
    data.reports.forEach((r) => { statusMap[r.id] = r.status; });

    listEl.innerHTML = myReports.map((m) => {
      const isDone = statusMap[m.id] === 'done';
      const notToday = !isToday(m.timestamp);
      return `
        <div class="my-status-row ${notToday ? 'not-today' : ''}">
          <span class="my-status-icon">${isDone ? '✅' : '⏳'}</span>
          <span class="my-status-info">
            <span class="dispatch">${escapeHtml(m.dispatchNo) || '?'}번 / ${escapeHtml(m.location) || '?'}</span>
            <span class="time">${formatMyTime(m.timestamp)}</span>
          </span>
          <span class="my-status-label ${isDone ? 'done' : 'pending'}">${isDone ? '처리완료' : '대기중'}</span>
        </div>
      `;
    }).join('');
  } catch (err) {
    listEl.innerHTML = '<div class="my-status-empty">불러오기에 실패했습니다. 다시 시도해주세요.</div>';
  }
}

const myStatusFab = document.getElementById('myStatusFab');
const refreshFab = document.getElementById('refreshFab');

function showFormTab() {
  document.getElementById('formScreen').classList.remove('hidden');
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('myStatusScreen').classList.add('hidden');
  document.getElementById('submitBar').style.display = 'block';
  myStatusFab.textContent = '📋';
  myStatusFab.title = '내 신고 현황';
  refreshFab.classList.add('hidden');
}

function showMyStatusTab() {
  document.getElementById('formScreen').classList.add('hidden');
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('myStatusScreen').classList.remove('hidden');
  document.getElementById('submitBar').style.display = 'none';
  myStatusFab.textContent = '✕';
  myStatusFab.title = '신고 화면으로';
  refreshFab.classList.remove('hidden');
  loadMyStatus();
}

myStatusFab.addEventListener('click', () => {
  const onStatus = !document.getElementById('myStatusScreen').classList.contains('hidden');
  if (onStatus) {
    showFormTab();
  } else {
    showMyStatusTab();
  }
});

refreshFab.addEventListener('click', loadMyStatus);

document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('dispatchNo').value = '';
  document.getElementById('location').value = '';
  itemList.innerHTML = '';
  itemCount = 0;
  addItem();
  reasonBtns.forEach(b => b.classList.remove('selected'));
  customReasonText.style.display = 'none';
  customReasonText.value = '';
  selectedReason = '';
  document.getElementById('formScreen').classList.remove('hidden');
  document.getElementById('submitBar').style.display = 'block';
  document.getElementById('resultScreen').style.display = 'none';
});

document.getElementById('dispatchNo').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/[^0-9]/g, '');
});

// 초기 항목 1개 생성
addItem();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch((err) => {
      console.error('서비스워커 등록 실패', err);
    });
  });
}
</script>
</body>
</html>
