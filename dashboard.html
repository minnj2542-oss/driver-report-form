<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신고 대시보드</title>
<style>
  :root {
    --primary: #3b5bdb;
    --primary-dark: #2f4bc7;
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #dcdfe4;
    --text: #1b1f27;
    --muted: #6b7280;
    --done-bg: #f1f2f4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  h1 { font-size: 22px; margin: 0; }
  #refreshBtn {
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 700;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #refreshBtn:hover { background: var(--primary-dark); }
  .section-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--muted);
    margin: 24px 0 10px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card.done {
    background: var(--done-bg);
    opacity: 0.5;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .card-head .dispatch {
    font-size: 19px;
    font-weight: 800;
    color: #dd5035;
  }
  .card.done .card-head .dispatch {
    color: var(--primary-dark);
  }
  .card-head .time {
    font-size: 13px;
    color: var(--muted);
  }
  .card-text {
    white-space: pre-wrap;
    font-size: 16px;
    line-height: 1.6;
    background: #f8f9fb;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .card-actions {
    display: flex;
    gap: 8px;
  }
  .card-actions button {
    flex: 1;
    padding: 10px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: #fff;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .card-actions button:hover {
    background: var(--bg);
    border-color: var(--primary);
  }
  .card-actions button:active {
    transform: scale(0.97);
  }
  .copy-btn { border-color: var(--primary); color: var(--primary-dark); }
  .copy-btn:hover { background: #eef1ff; }
  .copy-btn.copied { background: var(--primary); color: #fff; }
  .done-btn { color: var(--muted); }
  .done-btn.undo-btn { color: var(--primary-dark); border-color: var(--primary); }
  .done-btn.undo-btn:hover { background: #eef1ff; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h1>신고 대시보드</h1>
    <button id="refreshBtn" type="button">새로고침</button>
  </div>

  <div class="section-label">대기중</div>
  <div id="pendingList"></div>

  <div class="section-label">처리완료</div>
  <div id="doneList"></div>
</div>

<script>
// Apps Script 웹앱 배포 후 이 URL을 실제 /exec 주소로 교체하세요. (index.html과 동일한 주소)
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_KjCQveSYn0kXPpw9QZKmzsFTOm0IIBAjwi40cLkNXi-VWXdrmdQBpKu2P1Se-tvl/exec";

let currentReports = [];

async function loadReports() {
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    if (data.ok) {
      currentReports = data.reports;
      render(currentReports);
    }
  } catch (err) {
    console.error('불러오기 실패', err);
  }
}

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function render(reports) {
  const pending = reports.filter(r => r.status !== 'done');
  const done = reports.filter(r => r.status === 'done');

  const pendingList = document.getElementById('pendingList');
  const doneList = document.getElementById('doneList');

  pendingList.innerHTML = pending.length
    ? pending.map(r => cardHtml(r, false)).join('')
    : '<div class="empty">대기중인 신고가 없습니다.</div>';

  doneList.innerHTML = done.length
    ? done.map(r => cardHtml(r, true)).join('')
    : '<div class="empty">처리완료 항목이 없습니다.</div>';

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => copyText(btn));
  });
  document.querySelectorAll('.done-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleStatus(btn.dataset.id, btn.dataset.next));
  });
}

function cardHtml(r, isDone) {
  const escapedText = r.text.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  return `
    <div class="card ${isDone ? 'done' : ''}">
      <div class="card-head">
        <span class="dispatch">${r.dispatchNo || '?'} / ${r.location || '?'}</span>
        <span class="time">${formatTime(r.timestamp)}</span>
      </div>
      <div class="card-text">${escapedText}</div>
      <div class="card-actions">
        <button type="button" class="copy-btn" data-text="${encodeURIComponent(r.text)}">복사</button>
        <button type="button" class="done-btn ${isDone ? 'undo-btn' : ''}" data-id="${r.id}" data-next="${isDone ? 'pending' : 'done'}">${isDone ? '되돌리기' : '처리완료'}</button>
      </div>
    </div>
  `;
}

async function copyText(btn) {
  const text = decodeURIComponent(btn.dataset.text);
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = '복사됨';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 1500);
  } catch (err) {
    alert('복사에 실패했습니다.');
  }
}

async function toggleStatus(id, nextStatus) {
  const report = currentReports.find(r => r.id === id);
  if (!report) return;
  const prevStatus = report.status;
  report.status = nextStatus;
  render(currentReports);

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'setStatus', id, status: nextStatus })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '실패');
  } catch (err) {
    report.status = prevStatus;
    render(currentReports);
    alert('상태 변경에 실패했습니다.');
  }
}

document.getElementById('refreshBtn').addEventListener('click', loadReports);

loadReports();
setInterval(loadReports, 15000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadReports();
});
</script>
</body>
</html>
