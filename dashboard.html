<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신고 대시보드</title>
<link rel="manifest" href="dashboard-manifest.json">
<meta name="theme-color" content="#3b5bdb">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="신고대시보드">
<style>
  :root {
    --primary: #3b5bdb;
    --primary-dark: #2f4bc7;
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #dcdfe4;
    --text: #1b1f27;
    --muted: #6b7280;
    --done-bg: #f1f2f4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    font-size: 17px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  h1 { font-size: 22px; margin: 0; }
  #refreshBtn {
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 700;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #refreshBtn:hover { background: var(--primary-dark); }
  #notifyBtn {
    width: 40px;
    height: 40px;
    padding: 0;
    font-size: 18px;
    line-height: 1;
    background: #fff;
    color: var(--primary-dark);
    border: 2px solid var(--primary);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  #notifyBtn:hover { background: #eef1ff; }
  #notifyBtn.hidden { display: none; }
  .section-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--muted);
    margin: 24px 0 10px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .card.done {
    background: var(--done-bg);
    opacity: 0.5;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .card-head .dispatch {
    font-size: 19px;
    font-weight: 800;
    color: var(--primary-dark);
  }
  .card-head .time {
    font-size: 13px;
    color: var(--muted);
  }
  .card-text {
    white-space: pre-wrap;
    font-size: 16px;
    line-height: 1.6;
    background: #f8f9fb;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .card-actions {
    display: flex;
    gap: 8px;
  }
  .card-actions button {
    flex: 1;
    padding: 10px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: #fff;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .card-actions button:hover {
    background: var(--bg);
    border-color: var(--primary);
  }
  .card-actions button:active {
    transform: scale(0.97);
  }
  .copy-btn { border-color: var(--primary); color: var(--primary-dark); }
  .copy-btn:hover { background: #eef1ff; }
  .copy-btn.copied { background: var(--primary); color: #fff; }
  .done-btn { color: var(--muted); }
  .done-btn.undo-btn { color: var(--primary-dark); border-color: var(--primary); }
  .done-btn.undo-btn:hover { background: #eef1ff; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h1>신고 대시보드</h1>
    <div style="display:flex; gap:8px;">
      <button id="notifyBtn" type="button" title="알림 켜기/끄기">🔔</button>
      <button id="refreshBtn" type="button">새로고침</button>
    </div>
  </div>

  <div class="section-label" style="color:#dd5035;">대기중</div>
  <div id="pendingList"></div>

  <div class="section-label">처리완료</div>
  <div id="doneList"></div>
</div>

<script>
// Apps Script 웹앱 배포 후 이 URL을 실제 /exec 주소로 교체하세요. (index.html과 동일한 주소)
const APPS_SCRIPT_URL = "https://blue-snowflake-09f5.6611cc.workers.dev";

let currentReports = [];
let knownIds = null; // null = 아직 기준선을 안 잡음(첫 로딩). 상태(대기중/완료)와 무관하게 "한 번이라도 본 id"를 전부 기억.

async function loadReports() {
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    if (data.ok) {
      currentReports = data.reports;
      notifyNewReports(currentReports);
      render(currentReports);
    }
  } catch (err) {
    console.error('불러오기 실패', err);
  }
}

function notifyNewReports(reports) {
  const allIds = new Set(reports.map(r => r.id));

  if (knownIds === null) {
    // 페이지를 처음 열었을 때 이미 있던 신고는 알림 대상이 아님(기준선만 설정)
    knownIds = allIds;
    return;
  }

  if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && isNotifyEnabled()) {
    reports.forEach(r => {
      // 완전히 처음 보는 id만 "새 신고"로 알림. 처리완료↔되돌리기로 상태만
      // 바뀐 기존 신고는 knownIds에 계속 남아있어서 다시 알림이 울리지 않음.
      if (r.status !== 'done' && !knownIds.has(r.id)) {
        new Notification('신고가 접수되었습니다!', {
          body: `${r.dispatchNo || '?'} / ${r.location || '?'}`,
          tag: r.id
        });
      }
    });
  }

  knownIds = allIds;
}

// 브라우저 알림 권한 자체는 한 번 허용하면 JS로 다시 끌 수 없어서,
// 앱 안에서 켜고 끌 수 있는 별도 설정을 localStorage에 저장해서 관리.
function isNotifyEnabled() {
  return localStorage.getItem('notifyEnabled') === 'true';
}

function updateNotifyBtn() {
  const btn = document.getElementById('notifyBtn');
  if (typeof Notification === 'undefined') {
    btn.classList.add('hidden');
    return;
  }
  if (Notification.permission === 'denied') {
    btn.classList.add('hidden');
    return;
  }
  btn.classList.remove('hidden');
  if (Notification.permission === 'granted' && isNotifyEnabled()) {
    btn.textContent = '🔕';
    btn.title = '알림 끄기';
  } else {
    btn.textContent = '🔔';
    btn.title = '알림 켜기';
  }
}

document.getElementById('notifyBtn').addEventListener('click', () => {
  if (Notification.permission === 'granted' && isNotifyEnabled()) {
    localStorage.setItem('notifyEnabled', 'false');
    updateNotifyBtn();
    return;
  }
  if (Notification.permission === 'granted') {
    localStorage.setItem('notifyEnabled', 'true');
    updateNotifyBtn();
    return;
  }
  Notification.requestPermission().then((perm) => {
    if (perm === 'granted') localStorage.setItem('notifyEnabled', 'true');
    updateNotifyBtn();
  });
});
updateNotifyBtn();

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function render(reports) {
  const pending = reports.filter(r => r.status !== 'done');
  const done = reports.filter(r => r.status === 'done');

  const pendingList = document.getElementById('pendingList');
  const doneList = document.getElementById('doneList');

  pendingList.innerHTML = pending.length
    ? pending.map(r => cardHtml(r, false)).join('')
    : '<div class="empty">대기중인 신고가 없습니다.</div>';

  doneList.innerHTML = done.length
    ? done.map(r => cardHtml(r, true)).join('')
    : '<div class="empty">처리완료 항목이 없습니다.</div>';

  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', () => copyText(btn));
  });
  document.querySelectorAll('.done-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleStatus(btn.dataset.id, btn.dataset.next));
  });
}

function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function cardHtml(r, isDone) {
  const escapedText = escapeHtml(r.text);
  return `
    <div class="card ${isDone ? 'done' : ''}">
      <div class="card-head">
        <span class="dispatch">${escapeHtml(r.dispatchNo) || '?'} / ${escapeHtml(r.location) || '?'}</span>
        <span class="time">${formatTime(r.timestamp)}</span>
      </div>
      <div class="card-text">${escapedText}</div>
      <div class="card-actions">
        <button type="button" class="copy-btn" data-text="${encodeURIComponent(r.text)}">복사</button>
        <button type="button" class="done-btn ${isDone ? 'undo-btn' : ''}" data-id="${r.id}" data-next="${isDone ? 'pending' : 'done'}">${isDone ? '되돌리기' : '처리완료'}</button>
      </div>
    </div>
  `;
}

async function copyText(btn) {
  const text = decodeURIComponent(btn.dataset.text);
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = '복사됨';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 1500);
  } catch (err) {
    alert('복사에 실패했습니다.');
  }
}

async function toggleStatus(id, nextStatus) {
  const report = currentReports.find(r => r.id === id);
  if (!report) return;
  const prevStatus = report.status;
  report.status = nextStatus;
  render(currentReports);

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'setStatus', id, status: nextStatus })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '실패');
  } catch (err) {
    report.status = prevStatus;
    render(currentReports);
    alert('상태 변경에 실패했습니다.');
  }
}

document.getElementById('refreshBtn').addEventListener('click', loadReports);

loadReports();
setInterval(loadReports, 15000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadReports();
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./dashboard-service-worker.js').catch((err) => {
      console.error('서비스워커 등록 실패', err);
    });
  });
}
</script>
</body>
</html>
